worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    upstream icecast { server icecast:8000; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        location / { try_files $uri $uri/ =404; }
        location = /radio.mp3 {
            proxy_pass http://icecast/radio.mp3;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Host $host;
        }
        location = /status-json.xsl {
            proxy_pass http://icecast/status-json.xsl;
            proxy_set_header Host $host;
            add_header Cache-Control no-store;
        }
    }
}
